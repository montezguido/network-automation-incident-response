name: Verify independent DNS incident simulation

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  offline-dns-tests:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: '3.11'
          - os: ubuntu-latest
            python: '3.14'
          - os: windows-latest
            python: '3.14'
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - name: Compile Python
        run: python -m compileall -q portfolio_demo tests
      - name: Unit and regression tests
        run: python -m unittest discover -s tests -v
      - name: Simulated DNS incident lifecycle
        run: python portfolio_demo/dns_incident.py
      - name: Machine-readable report
        run: python portfolio_demo/dns_incident.py --json
